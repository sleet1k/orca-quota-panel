<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --turbo: #10b981;
    --balance: #f59e0b;
    --eco: #f43f5e;
    --ok: #10b981;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; background: transparent; }
  body {
    color: var(--orca-foreground);
    font-family: var(--orca-font-sans);
    font-size: 13px;
    line-height: 1.35;
    padding: 10px;
    min-width: 260px;
  }
  .tnum { font-variant-numeric: tabular-nums; }
  .header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .title { font-size: 14px; font-weight: 600; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 7px;
    border: 1px solid var(--orca-border); background: var(--orca-card);
    color: var(--orca-card-foreground); cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center; font-size: 14px; line-height: 1;
    transition: background .12s, transform .12s;
  }
  .icon-btn:hover { background: var(--orca-accent); }
  .icon-btn.on { background: color-mix(in srgb, var(--balance) 22%, transparent); border-color: var(--balance); color: var(--balance); }
  .icon-btn:disabled { opacity: .6; cursor: default; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* language switcher (compact dropdown) */
  .lang-wrap { position: relative; flex: 0 0 auto; }
  .lang-btn {
    border: 1px solid var(--orca-border); background: var(--orca-card); color: var(--orca-foreground);
    font-size: 11px; font-weight: 600; padding: 3px 7px; border-radius: 7px; cursor: pointer; line-height: 1.4;
    display: inline-flex; align-items: center; gap: 3px; transition: background .12s;
  }
  .lang-btn:hover { background: var(--orca-accent); }
  .lang-btn .chev { font-size: 8px; opacity: .8; }
  .lang-pop {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 150px;
    background: var(--orca-popover); color: var(--orca-popover-foreground);
    border: 1px solid var(--orca-border); border-radius: 9px; padding: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .lang-pop.hidden { display: none; }
  .lang-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
    cursor: pointer; font-size: 12px;
  }
  .lang-item:hover { background: var(--orca-accent); }
  .lang-item .lang-name { color: var(--orca-muted-foreground); font-size: 11px; }
  .lang-item .check { margin-left: auto; font-size: 11px; opacity: .9; }

  /* mode pill */
  .pill-wrap { position: relative; flex: 0 0 auto; }
  .pill {
    border: 1px solid transparent; cursor: pointer; font-weight: 600; font-size: 12px;
    padding: 3px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px;
    color: #fff; user-select: none; white-space: nowrap;
  }
  .pill .chev { font-size: 9px; opacity: .9; }
  .pill.turbo { background: color-mix(in srgb, var(--turbo) 88%, black); }
  .pill.balance { background: color-mix(in srgb, var(--balance) 88%, black); }
  .pill.eco { background: color-mix(in srgb, var(--eco) 88%, black); }
  .popover {
    position: absolute; right: 0; top: calc(100% + 6px); z-index: 50; min-width: 190px;
    background: var(--orca-popover); color: var(--orca-popover-foreground);
    border: 1px solid var(--orca-border); border-radius: 9px; padding: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  .popover.hidden { display: none; }
  .pop-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px;
    cursor: pointer; font-size: 12.5px;
  }
  .pop-item:hover { background: var(--orca-accent); }
  .pop-item .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .pop-item .check { margin-left: auto; font-size: 11px; opacity: .9; }

  .card {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 8px; padding: 12px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .muted { color: var(--orca-muted-foreground); }
  .sm { font-size: 12px; }
  .semibold { font-weight: 600; }

  .bar {
    position: relative; height: 8px; border-radius: 999px; background: rgba(255,255,255,.08);
    margin: 8px 0 4px; overflow: hidden;
  }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 999px; transition: width .3s, background .3s; }
  .bar .tick { position: absolute; top: -2px; bottom: -2px; width: 1px; background: rgba(255,255,255,.55); }

  .kv { margin-top: 6px; }
  .kv .row { padding: 2px 0; }

  /* thresholds */
  .sec-title { font-size: 12px; font-weight: 600; margin: 2px 0 6px; }
  .thr-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .thr-row .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .thr-left { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .thr-name { font-size: 12.5px; display: flex; align-items: center; gap: 5px; }
  .thr-sum { font-size: 10.5px; color: var(--orca-muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info {
    width: 13px; height: 13px; line-height: 12px; text-align: center; border-radius: 50%;
    border: 1px solid var(--orca-border); color: var(--orca-muted-foreground);
    font-size: 9px; font-style: normal; cursor: help; flex: 0 0 auto;
  }
  .thr-ctl { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .thr-row .range { color: var(--orca-muted-foreground); font-size: 12px; }
  .thr-row input {
    width: 54px; flex: 0 0 auto; text-align: right; padding: 3px 5px;
    background: var(--orca-input); color: var(--orca-foreground);
    border: 1px solid var(--orca-border); border-radius: 6px; font-size: 12.5px;
    font-variant-numeric: tabular-nums;
  }
  .thr-row input.invalid { border-color: var(--eco); box-shadow: 0 0 0 1px var(--eco) inset; }
  .gear {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--orca-border); background: var(--orca-card); color: var(--orca-muted-foreground);
    font-size: 12px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s;
  }
  .gear:hover { background: var(--orca-accent); color: var(--orca-foreground); }
  .gear.on { background: color-mix(in srgb, var(--balance) 22%, transparent); border-color: var(--balance); color: var(--balance); }

  .cfg-panel { display: none; margin: 2px 0 6px 17px; padding: 8px 10px; border: 1px solid var(--orca-border); border-radius: 8px; background: rgba(255,255,255,.02); }
  .cfg-panel.open { display: block; }
  .cfg-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; font-size: 12px; }
  .cfg-grid label { color: var(--orca-muted-foreground); white-space: nowrap; }
  /* explicit dark-friendly colors so native select/option text is readable in Windows WebView */
  .cfg-grid select {
    width: 100%; min-width: 0; padding: 3px 6px;
    background-color: var(--orca-input); color: var(--orca-foreground);
    border: 1px solid var(--orca-border); border-radius: 6px; font-size: 12px;
    color-scheme: dark;
  }
  .cfg-grid select option,
  .cfg-grid select optgroup {
    background-color: var(--orca-input); color: var(--orca-foreground);
  }
  .cfg-chk { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; color: var(--orca-foreground); cursor: pointer; }
  .cfg-chk input { accent-color: var(--balance); }
  .cfg-grid input {
    width: 100%; min-width: 0; padding: 3px 6px;
    background-color: var(--orca-input); color: var(--orca-foreground);
    border: 1px solid var(--orca-border); border-radius: 6px; font-size: 12px;
    color-scheme: dark;
  }
  .cfg-note { margin-top: 6px; font-size: 10.5px; color: var(--orca-muted-foreground); line-height: 1.35; }

  .save-btn {
    margin-top: 8px; width: 100%; padding: 6px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--orca-border); background: var(--orca-secondary); color: var(--orca-secondary-foreground);
    font-size: 12.5px; font-weight: 500; transition: opacity .12s, background .12s;
  }
  .save-btn:disabled { opacity: .45; cursor: default; }
  .save-btn:not(:disabled):hover { background: var(--orca-accent); }
  .save-btn.saved { background: color-mix(in srgb, var(--ok) 22%, transparent); border-color: var(--ok); color: var(--ok); }

  /* key accordion */
  .acc { border: 1px solid var(--orca-border); border-radius: 8px; overflow: hidden; }
  .acc-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer;
    background: rgba(255,255,255,.02); font-size: 12.5px; user-select: none;
  }
  .acc-head .chev { margin-left: auto; transition: transform .15s; font-size: 10px; }
  .acc.open .acc-head .chev { transform: rotate(90deg); }
  .acc-body { display: none; padding: 10px; border-top: 1px solid var(--orca-border); }
  .acc.open .acc-body { display: block; }
  .key-status { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--orca-muted); color: var(--orca-muted-foreground); }
  .key-status.set { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .key-input-wrap { display: flex; gap: 6px; align-items: center; }
  .key-input-wrap input {
    flex: 1 1 auto; min-width: 0; padding: 6px 8px; background: var(--orca-input);
    color: var(--orca-foreground); border: 1px solid var(--orca-border); border-radius: 6px; font-size: 12.5px;
  }
  .full-btn { margin-top: 8px; width: 100%; padding: 6px; border-radius: 7px; cursor: pointer; border: 1px solid var(--orca-border); background: var(--orca-secondary); color: var(--orca-secondary-foreground); font-size: 12.5px; }
  .full-btn:hover { background: var(--orca-accent); }

  .err { color: var(--eco); font-size: 12px; margin: 8px 0; }
  .sep { height: 1px; background: var(--orca-border); margin: 12px 0; }
  .tooltip { position: relative; }
  .tooltip:hover::after {
    content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    background: var(--orca-popover); color: var(--orca-popover-foreground); border: 1px solid var(--orca-border);
    border-radius: 6px; padding: 4px 7px; font-size: 11px; white-space: nowrap; z-index: 60; box-shadow: 0 4px 14px rgba(0,0,0,.3);
  }

  /* custom HTML/CSS tooltip (200ms delay), positioned via JS to avoid clipping */
  .tip-pop {
    display: none; position: fixed; z-index: 200; max-width: 240px; width: max-content;
    background: var(--orca-popover); color: var(--orca-popover-foreground);
    border: 1px solid var(--orca-border); border-radius: 8px; padding: 7px 9px;
    font-size: 11.5px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    pointer-events: none; opacity: 0; transition: opacity .1s;
  }
  .tip-pop.show { opacity: 1; }
  .tip-pop b { display: block; font-size: 11px; margin-bottom: 3px; }
  .tip-pop .tip-dim { color: var(--orca-muted-foreground); }

  /* version badge in header */
  .ver-badge {
    flex: 0 0 auto; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 999px;
    background: var(--orca-muted); color: var(--orca-muted-foreground); font-variant-numeric: tabular-nums;
  }
  /* compact green "installed" badge (non-clickable) */
  .ok-badge {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
    padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok);
  }
  /* collapsible section (header click toggles body) */
  .sect { border: 1px solid var(--orca-border); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .sect-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer;
    background: rgba(255,255,255,.02); font-size: 12.5px; font-weight: 600; user-select: none;
  }
  .sect-head:hover { background: rgba(255,255,255,.04); }
  .sect-head .chev { margin-left: auto; transition: transform .15s; font-size: 10px; color: var(--orca-muted-foreground); }
  .sect.open .sect-head .chev { transform: rotate(90deg); }
  .sect-body { display: none; padding: 10px; border-top: 1px solid var(--orca-border); }
  .sect.open .sect-body { display: block; }
  .sect-head .head-right { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  .sect-head .head-right .chev { margin-left: 0; }
  /* 2x2 numeric grid for skill config */
  .cfg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cfg2 .fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cfg2 .fld label { font-size: 11px; color: var(--orca-muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cfg2 .fld input, .cfg2 .fld select {
    width: 100%; min-width: 0; padding: 4px 6px; background-color: var(--orca-input); color: var(--orca-foreground);
    border: 1px solid var(--orca-border); border-radius: 6px; font-size: 12px; color-scheme: dark;
  }
  .cfg2 .fld.wide { grid-column: 1 / -1; }
  /* log toolbar + autoscroll box */
  .log-tools { display: inline-flex; gap: 4px; }
  .log-tools button {
    font-size: 10.5px; padding: 2px 7px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--orca-border); background: var(--orca-card); color: var(--orca-muted-foreground);
  }
  .log-tools button:hover { background: var(--orca-accent); color: var(--orca-foreground); }
  #logview { max-height: 160px; overflow: auto; background: var(--orca-input); border: 1px solid var(--orca-border);
    border-radius: 6px; padding: 6px; font-size: 10.5px; line-height: 1.3; color: var(--orca-muted-foreground);
    white-space: pre-wrap; word-break: break-all; margin-top: 8px; }
  #logview .lg-err { color: #f87171; }
  #logview .lg-warn { color: #fbbf24; }
  #logview .lg-info { color: var(--orca-muted-foreground); }
  /* settings modal */
  .modal-bg { position: fixed; inset: 0; z-index: 120; background: rgba(0,0,0,.5);
    display: flex; align-items: flex-start; justify-content: center; padding-top: 60px; }
  .modal { width: 100%; max-width: 340px; background: var(--orca-popover); color: var(--orca-popover-foreground);
    border: 1px solid var(--orca-border); border-radius: 10px; padding: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .modal-head { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .modal-head .icon-btn { margin-left: auto; }
</style>
</head>

    function detectLang() {
      var nav = (navigator.language || (window.orca && window.orca.locale) || 'en').toLowerCase();
      if (nav.indexOf('ru') === 0) return 'ru';
      if (nav.indexOf('zh') === 0) return 'zh';
      return 'en';
    }

    function boot(orca) {
    const COLORS = { turbo: '#10b981', balance: '#f59e0b', eco: '#f43f5e' };
    const EFFORTS = ['low', 'medium', 'high', 'xhigh'];
    const LANGS = ['en', 'ru', 'zh'];
    const LANG_LABEL = { en: 'EN', ru: 'RU', zh: '中文' };
    let L = I18N.en;     // активный словарь
    let lang = 'en';     // активный язык
    let langTouched = false; // был ли ручной выбор (чтобы не перетирать автоопределение)
    let state = null;
    let popOpen = false;
    let langOpen = false;
    let accOpen = false;
    let settingsOpen = false;
    let openCfg = null;
    let sectOpen = { key: false, cfg: false, install: false, logs: false };
    let keyDraft = '';
    let revealedKey = '';
    let revealTimer = null;
    let pinSetup = false;   // showing the "set PIN" form
    let pinAsk = false;     // showing the "enter PIN to reveal" form
    let pinErr = '';        // inline error text
    let hasPin = false;     // whether a PIN is set (from worker)
    let savedTimer = null;

    function t() { return L; }
    function fmt(s, vars) {
      return String(s).replace(/\{(\w+)\}/g, function (_, k) { return vars[k] != null ? vars[k] : '{' + k + '}'; });
    }
    function modeLabel(m) { return m === 'auto' ? L.auto : L.modes[m]; }

    async function req(name, input) {
      return await orca.plugin.request(name, input || {});
    }

    function fmtResetLocal(resetAt) {
      if (!resetAt) return '';
      const d = new Date(resetAt);
      return d.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function fmtCountdown(resetAt) {
      if (!resetAt) return '—';
      let s = Math.max(0, Math.floor((resetAt - Date.now()) / 1000));
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
      const pad = function (n) { return (n < 10 ? '0' : '') + n; };
      return pad(h) + ':' + pad(m) + ':' + pad(ss);
    }

    function modeSummary(m) {
      const c = (state.modeConfigs && state.modeConfigs[m]) || { effort: '—', workers: '?', subagents: false };
      return fmt(L.summary, { e: c.effort, w: c.workers, s: c.subagents ? L.subOn : L.subOff });
    }

    function tipHtml(m) {
      const cfg = (state.modeConfigs && state.modeConfigs[m]) || {};
      const cond = m === 'turbo' ? fmt(L.tipCondTurbo, { t: state.turboAbove })
        : m === 'eco' ? fmt(L.tipCondEco, { e: state.ecoBelow })
        : m === 'balance' ? fmt(L.tipCondBalance, { e: state.ecoBelow, t: state.turboAbove })
        : L.tipCondAuto;
      const beh = m === 'turbo' ? L.tipBehTurbo
        : m === 'eco' ? L.tipBehEco
        : m === 'balance' ? L.tipBehBalance
        : L.tipBehAuto;
      const params = (m === 'auto') ? '' : '<br><span class="tip-dim">' +
        fmt(L.tipParams, { e: cfg.effort, w: cfg.workers, s: cfg.subagents ? L.subOn : L.subOff }) + '</span>';
      return '<b>' + modeLabel(m) + '</b>' + cond + '<br>' + beh + params;
    }

    function copyText(txt, done) {
      // Clipboard API is blocked in some webviews; fall back to execCommand.
      var ok = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(function () { ok = true; if (done) done(true); }, function () { if (done) done(legacyCopy(txt)); });
          return;
        }
      } catch (e) { /* fall through */ }
      if (done) done(legacyCopy(txt));
    }
    function legacyCopy(txt) {
      try {
        var ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }

    async function refresh(spin) {
      const btn = document.getElementById('refreshBtn');
      if (spin && btn) { btn.classList.add('spin'); btn.disabled = true; }
      try {
        state = await req('quota.get');
        if (state && !state._t) state._t = {};
        if (state && !state.modeConfigs) state.modeConfigs = {};
        try {
          var sc = await req('quota.getSkillConfig');
          if (sc && sc.ok) {
            state._skillConfigText = sc.config;
            try { state._skillCfg = JSON.parse(sc.config) || {}; } catch (e) { state._skillCfg = {}; }
          }
        } catch (e) { /* ignore */ }
        try { var gi = await req('quota.getInstalled'); if (gi && gi.ok) state._installedPath = gi.path; } catch (e) { /* ignore */ }
        try { var hp = await req('quota.hasPin'); if (hp && hp.ok) hasPin = hp.hasPin; } catch (e) { /* ignore */ }
        try { var lg = await req('quota.getLogs'); if (lg && lg.ok) state._logs = lg.lines || []; } catch (e) { /* ignore */ }
        // Язык: ручной выбор из storage, иначе автоопределение по локали.
        if (!langTouched) {
          const stored = state && state.lang;
          lang = (stored === 'en' || stored === 'ru' || stored === 'zh') ? stored : detectLang();
          L = I18N[lang];
          document.documentElement.lang = lang;
        }
        if (!state._init) {
          state._draftTurbo = String(state.turboAbove);
          state._draftEco = String(state.ecoBelow);
          state._init = true;
        }
      } catch (e) {
        state = state || { ok: false, error: String(e) };
      }
      render();
      if (spin && btn) { btn.classList.remove('spin'); btn.disabled = false; }
    }

    function cfgPanel(m) {
      const c = (state.modeConfigs && state.modeConfigs[m]) || { effort: 'medium', workers: 2, subagents: false };
      const opts = EFFORTS.map(e => '<option value="' + e + '"' + (c.effort === e ? ' selected' : '') + '>' + e + '</option>').join('');
      const wopts = [1, 2, 3, 4].map(n => '<option value="' + n + '"' + (c.workers === n ? ' selected' : '') + '>' + n + '</option>').join('');
      return '' +
        '<div class="cfg-panel ' + (openCfg === m ? 'open' : '') + '" data-cfg-panel="' + m + '">' +
          '<div class="cfg-grid">' +
            '<label>' + L.cfgEffort + '</label>' +
            '<select data-cfg-field="effort" data-mode="' + m + '">' + opts + '</select>' +
            '<label>' + L.cfgWorkers + '</label>' +
            '<select data-cfg-field="workers" data-mode="' + m + '">' + wopts + '</select>' +
            '<label class="cfg-chk"><input type="checkbox" data-cfg-field="subagents" data-mode="' + m + '"' + (c.subagents ? ' checked' : '') + '> ' + L.cfgSubagents + '</label>' +
          '</div>' +
          '<div class="cfg-note">' + L.cfgNote + '</div>' +
        '</div>';
    }

    function skillCfgFields() {
      const c = (state && state._skillCfg) || {};
      const eff = c.defaultEffort || 'high';
      const opts = ['low', 'medium', 'high', 'xhigh'].map(function (e) {
        return '<option value="' + e + '"' + (eff === e ? ' selected' : '') + '>' + e + '</option>';
      }).join('');
      // Compact 2x2 numeric grid, then effort/timezone/workWindow on full-width rows.
      return '' +
        '<div class="cfg2">' +
          '<div class="fld"><label data-tip="' + esc(L.cfCronHint) + '">' + L.cfCron + '</label><input id="cfgCron" type="number" min="1" value="' + (c.cronMinutes != null ? c.cronMinutes : 30) + '"></div>' +
          '<div class="fld"><label data-tip="' + esc(L.cfMaxWHint) + '">' + L.cfMaxW + '</label><input id="cfgMaxW" type="number" min="1" max="8" value="' + (c.maxWorkers != null ? c.maxWorkers : 5) + '"></div>' +
          '<div class="fld"><label data-tip="' + esc(L.cfRpmHint) + '">' + L.cfRpm + '</label><input id="cfgRpm" type="number" min="1" value="' + (c.perWorkerRpm != null ? c.perWorkerRpm : 4) + '"></div>' +
          '<div class="fld"><label data-tip="' + esc(L.cfCapHint) + '">' + L.cfCap + '</label><input id="cfgCap" type="number" min="1" value="' + (c.rpmCap != null ? c.rpmCap : 20) + '"></div>' +
          '<div class="fld"><label data-tip="' + esc(L.cfEffortHint) + '">' + L.cfEffort + '</label><select id="cfgEffort">' + opts + '</select></div>' +
          '<div class="fld"><label data-tip="' + esc(L.cfTzHint) + '">' + L.cfTz + '</label><input id="cfgTz" value="' + (c.timezone || '') + '" placeholder="' + L.cfTzLocal + '"></div>' +
          '<div class="fld wide"><label data-tip="' + esc(L.cfWinHint) + '">' + L.cfWin + '</label><input id="cfgWin" type="number" min="1" step="0.5" value="' + (c.workWindowHours != null ? c.workWindowHours : '') + '" placeholder="' + L.cfWinIdle + '"></div>' +
        '</div>';
    }

    function logHtml(lines) {
      if (!lines || !lines.length) return '';
      return lines.map(function (l) {
        var t = new Date(l.ts).toLocaleTimeString();
        var line = String(l.line).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; });
        var lvl = String(l.level || 'info').toLowerCase();
        var cls = 'lg-info';
        if (lvl === 'error' || /\b(error|failed|429|exception)\b/i.test(line)) cls = 'lg-err';
        else if (lvl === 'warn' || /\b(warn|warning)\b/i.test(line)) cls = 'lg-warn';
        return '<span class="' + cls + '">' + t + ' ' + lvl + ' ' + line + '</span>';
      }).join('\n');
    }

    function render() {
      const app = document.getElementById('app');
      const q = state;
      if (!q) { app.innerHTML = '<div class="muted sm">' + L.loading + '</div>'; return; }
      const mode = q.effectiveMode || 'eco';
      const remainFrac = q.limit > 0 ? (q.remaining / q.limit) : 0;
      const remainPct = Math.round(remainFrac * 100);
      // Ticks are on the remaining scale: fraction of quota still available at each threshold.
      const turboTick = q.limit > 0 ? (q.turboAbove / q.limit) * 100 : 100;
      const ecoTick = q.limit > 0 ? (q.ecoBelow / q.limit) * 100 : 0;
      const version = q.version ? 'v' + q.version : '';

      const langSw = '' +
        '<div class="lang-wrap">' +
          '<button class="lang-btn" id="langBtn" title="' + L.changeMode + '">' + LANG_LABEL[lang] + ' <span class="chev">▾</span></button>' +
          '<div class="lang-pop' + (langOpen ? '' : ' hidden') + '" id="langPop">' +
            LANGS.map(function (lg) {
              const names = { en: 'English', ru: 'Русский', zh: '简体中文' };
              return '<div class="lang-item" data-lang="' + lg + '">' +
                '<span>' + LANG_LABEL[lg] + '</span>' +
                '<span class="lang-name">' + names[lg] + '</span>' +
                (lg === lang ? '<span class="check">✓</span>' : '') +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>';

      const modePill = '' +
        '<div class="pill-wrap">' +
          '<div class="pill ' + mode + '" id="pill" title="' + L.changeMode + '">' +
            '<span>' + modeLabel(mode) + '</span><span class="chev">▾</span>' +
          '</div>' +
          '<div class="popover ' + (popOpen ? '' : 'hidden') + '" id="pop">' +
            ['auto','turbo','balance','eco'].map(function (m) {
              return '<div class="pop-item" data-mode="' + m + '" data-tip-mode="' + m + '">' +
                '<span class="dot" style="background:' + (m === 'auto' ? 'var(--orca-muted-foreground)' : COLORS[m]) + '"></span>' +
                '<span>' + (m === 'auto' ? L.autoPill : modeLabel(m)) + '</span>' +
                ((q.manualMode === m) ? '<span class="check">✓</span>' : '') +
              '</div>';
            }).join('') +
          '</div>' +
        '</div>';

      const errBlock = (!q.ok && q.error) ? '<div class="err">' + q.error + '</div>' : '';
      const keyStatus = q.hasKey ? (q.keyFromTxt ? L.keySetTxt : L.keySet) : L.keyUnset;

      // --- Settings modal (thresholds only) ---
      const settingsModal = settingsOpen ? ('' +
        '<div class="modal-bg" id="modalBg">' +
          '<div class="modal">' +
            '<div class="modal-head"><span>' + L.settingsTitle + '</span>' +
              '<button class="icon-btn" id="modalClose" title="' + L.close + '">✕</button></div>' +
            '<div class="thr-row">' +
              '<span class="dot" style="background:' + COLORS.turbo + '"></span>' +
              '<div class="thr-left"><span class="thr-name">' + modeLabel('turbo') + ' <i class="info" data-tip-mode="turbo">i</i></span></div>' +
              '<div class="thr-ctl"><span class="range">&gt;</span>' +
                '<input id="inTurbo" class="tnum" inputmode="numeric" value="' + q._draftTurbo + '" /></div>' +
            '</div>' +
            '<div class="thr-row">' +
              '<span class="dot" style="background:' + COLORS.balance + '"></span>' +
              '<div class="thr-left"><span class="thr-name">' + modeLabel('balance') + ' <i class="info" data-tip-mode="balance">i</i></span></div>' +
              '<div class="thr-ctl">' +
                '<input id="inBalMin" class="tnum" inputmode="numeric" value="' + q._draftEco + '" data-tip="' + esc(L.balMin) + '" />' +
                '<span class="range">–</span>' +
                '<input id="inBalMax" class="tnum" inputmode="numeric" value="' + q._draftTurbo + '" data-tip="' + esc(L.balMax) + '" />' +
              '</div>' +
            '</div>' +
            '<div class="thr-row">' +
              '<span class="dot" style="background:' + COLORS.eco + '"></span>' +
              '<div class="thr-left"><span class="thr-name">' + modeLabel('eco') + ' <i class="info" data-tip-mode="eco">i</i></span></div>' +

            '<div class="tick" style="left:' + Math.max(0, Math.min(100, turboTick)) + '%"></div>' +
          '</div>' +
          '<div class="row sm muted tnum">' +
            '<span>' + L.used + '</span>' +
            '<span>' + q.used + ' / ' + q.limit + ' · ' + remainPct + '% ' + L.leftShort + '</span>' +
          '</div>' +
          '<div class="kv">' +
            '<div class="row sm">' +
              '<span class="muted" data-tip="' + fmtResetLocal(q.resetAt) + '">' + L.reset + '</span>' +
              '<span class="tnum semibold" id="countdown">' + fmtCountdown(q.resetAt) + '</span>' +
            '</div>' +
            '<div class="bar" style="height:4px;margin:6px 0 2px">' +
              '<div class="fill" style="width:' + (q.resetAt ? ((Date.now() % 86400000) / 86400000 * 100).toFixed(1) : 0) + '%;background:var(--orca-muted-foreground)"></div>' +
            '</div>' +

        // API key section (collapsible)
        '<div class="sect ' + (sectOpen.key ? 'open' : '') + '" data-sect="key">' +
          '<div class="sect-head" data-sect-head="key"><span>' + L.keyTitle + '</span>' +
            '<span class="head-right">' + (q.hasKey ? '<span class="key-status set">' + keyStatus + '</span>' : '<span class="key-status">' + keyStatus + '</span>') +
            '<span class="chev">▶</span></span></div>' +
          '<div class="sect-body">' +
            (q.hasKey
              ? (revealedKey
                  ? '<div class="key-input-wrap"><input id="keyReveal" type="text" readonly value="' + esc(revealedKey) + '" />' +
                      '<button class="icon-btn" id="copyKey" title="' + L.copyKey + '">📋</button></div>' +
                    '<div class="cfg-note">' + L.keyHidden + ' (30s)</div>'
                  : pinSetup
                    ? '<div class="key-input-wrap"><input id="pin1" type="password" placeholder="' + L.pinPrompt + '" /></div>' +
                      '<div class="key-input-wrap" style="margin-top:6px"><input id="pin2" type="password" placeholder="' + L.pinConfirm + '" /></div>' +
                      (pinErr ? '<div class="err">' + esc(pinErr) + '</div>' : '') +
                      '<div style="display:flex;gap:6px;margin-top:6px">' +
                        '<button class="full-btn" id="savePin" style="margin-top:0;flex:1">' + L.pinSave + '</button>' +
                        '<button class="full-btn" id="cancelPin" style="margin-top:0;flex:1">' + L.cancel + '</button>' +
                      '</div>'
                    : pinAsk
                      ? '<div class="key-input-wrap"><input id="pinAsk" type="password" placeholder="' + L.pinPrompt + '" /></div>' +
                        (pinErr ? '<div class="err">' + esc(pinErr) + '</div>' : '') +
                        '<div style="display:flex;gap:6px;margin-top:6px">' +
                          '<button class="full-btn" id="submitPin" style="margin-top:0;flex:1">👁 ' + L.showKey + '</button>' +
                          '<button class="full-btn" id="cancelPin" style="margin-top:0;flex:1">' + L.cancel + '</button>' +
                        '</div>'
                      : '<div style="display:flex;gap:6px">' +
                          '<button class="full-btn" id="showKey" style="margin-top:0;flex:1">👁 ' + L.showKey + '</button>' +
                          '<button class="full-btn" id="removeKey" style="margin-top:0;flex:1;color:var(--orca-destructive,#e06c6c)">' + L.removeKey + '</button>' +
                        '</div>')
              : '<div class="key-input-wrap">' +
                  '<input id="keyInput" type="password" placeholder="sk-or-v1-…" value="' + keyDraft + '" />' +
                '</div>' +
                '<button class="full-btn" id="saveKey" style="margin-top:6px">' + L.saveKey + '</button>') +
          '</div>' +
        '</div>' +

        // Skill config section (collapsible)
        '<div class="sect ' + (sectOpen.cfg ? 'open' : '') + '" data-sect="cfg">' +
          '<div class="sect-head" data-sect-head="cfg"><span>' + L.skillConfigTitle + ' <i class="info" data-tip="' + esc(L.cfgInfo) + '">i</i></span><span class="chev">▶</span></div>' +
          '<div class="sect-body">' +
            skillCfgFields() +

          '</div>' +

        // Install section (collapsible)
        '<div class="sect ' + (sectOpen.install ? 'open' : '') + '" data-sect="install">' +

            '<span class="head-right">' + (q._installedPath ? '<span class="ok-badge">✓ ' + L.installedBadge + '</span>' : '') +
            '<span class="chev">▶</span></span></div>' +
          '<div class="sect-body">' +
            (!q._installedPath ? '<button class="full-btn" id="installSkillBtn" style="margin-top:0">' + L.installSkill + '</button>' : '') +
            '<div class="cfg-note" id="installStatus">' + (q._installedPath ? fmt(L.installPath, { path: q._installedPath }) : '') + '</div>' +
            (q._installedPath ? '<button class="full-btn" id="uninstallSkillBtn" style="margin-top:6px;color:var(--orca-destructive,#e06c6c)">' + L.uninstallSkill + '</button>' : '') +

        '<div class="sect ' + (sectOpen.logs ? 'open' : '') + '" data-sect="logs">' +

            '<span class="head-right">' +
              '<span class="log-tools"><button id="copyLogs">' + L.copyLogs + '</button><button id="clearLogs">' + L.clearLogs + '</button></span>' +
              '<span class="chev">▶</span></span></div>' +

        settingsModal +

      bind();
      updateSaveState();
      updateSkillCfgDirty();

      if (sectOpen.logs) { var lv = document.getElementById('logview'); if (lv) lv.scrollTop = lv.scrollHeight; }

    // Пороги: min=ecoBelow, max=turboAbove. Валидно: 0 <= min < max.
    function thresholdsValid() {
      const t = parseInt(state._draftTurbo, 10);
      const e = parseInt(state._draftEco, 10);
      const tBad = Number.isNaN(t) || t < 0;
      const eBad = Number.isNaN(e) || e < 0;
      const orderBad = !tBad && !eBad && !(e < t);
      [['inTurbo', tBad || orderBad], ['inBalMax', tBad || orderBad],
       ['inEco', eBad || orderBad], ['inBalMin', eBad || orderBad]].forEach(function (pair) {
        const el = document.getElementById(pair[0]);
        if (el) el.classList.toggle('invalid', !!pair[1]);
      });
      return !tBad && !eBad && !orderBad;
    }

    function updateSaveState() {
      const t = parseInt(state._draftTurbo, 10);
      const e = parseInt(state._draftEco, 10);
      const valid = thresholdsValid();
      const dirty = String(t) !== String(state.turboAbove) || String(e) !== String(state.ecoBelow);
      const btn = document.getElementById('saveThr');
      if (!btn) return;
      btn.disabled = !(valid && dirty);
      btn.classList.remove('saved');
      btn.textContent = L.saveThresholds;
    }

    function syncThresholdInputs(source) {
      const t = document.getElementById('inTurbo');
      const e = document.getElementById('inEco');
      const bMin = document.getElementById('inBalMin');
      const bMax = document.getElementById('inBalMax');
      if (source === 'turbo') { if (bMax) bMax.value = state._draftTurbo; }
      else { if (bMin) bMin.value = state._draftEco; }
      updateSaveState();
    }

    // Read the skill-config form into a plain object (numbers coerced).
    function readSkillCfgForm() {
      var g = function (id) { var el = document.getElementById(id); return el ? el.value : ''; };
      var win = g('cfgWin').trim();
      return {
        cronMinutes: parseInt(g('cfgCron'), 10) || 30,
        maxWorkers: parseInt(g('cfgMaxW'), 10) || 5,
        perWorkerRpm: parseInt(g('cfgRpm'), 10) || 4,
        rpmCap: parseInt(g('cfgCap'), 10) || 20,
        defaultEffort: g('cfgEffort') || 'high',
        timezone: g('cfgTz').trim() || null,
        workWindowHours: win ? (parseFloat(win) || null) : null
      };
    }

    // "Save config" is active only when the form differs from the saved config.
    function updateSkillCfgDirty() {
      var btn = document.getElementById('saveSkillConfig');
      if (!btn || !state) return;
      var saved = state._skillCfg || {};
      var cur = readSkillCfgForm();
      var dirty = JSON.stringify(cur) !== JSON.stringify({
        cronMinutes: saved.cronMinutes != null ? saved.cronMinutes : 30,
        maxWorkers: saved.maxWorkers != null ? saved.maxWorkers : 5,
        perWorkerRpm: saved.perWorkerRpm != null ? saved.perWorkerRpm : 4,
        rpmCap: saved.rpmCap != null ? saved.rpmCap : 20,
        defaultEffort: saved.defaultEffort || 'high',
        timezone: saved.timezone || null,
        workWindowHours: saved.workWindowHours != null ? saved.workWindowHours : null
      });
      btn.disabled = !dirty;
      btn.classList.remove('saved');
      btn.textContent = L.saveSkillConfig;
    }

    function bind() {
      document.getElementById('refreshBtn').onclick = function () { refresh(true); };

      // language switcher — compact dropdown, persisted via worker
      document.getElementById('langBtn').onclick = function (ev) {
        ev.stopPropagation();
        langOpen = !langOpen;
        const p = document.getElementById('langPop');
        if (p) p.classList.toggle('hidden', !langOpen);
      };
      document.querySelectorAll('#langPop [data-lang]').forEach(function (b) {
        b.onclick = async function (ev) {
          ev.stopPropagation();
          langOpen = false;
          const lg = b.dataset.lang;
          if (lg === lang) { render(); return; }
          langTouched = true;
          lang = lg;
          L = I18N[lg];
          document.documentElement.lang = lg;
          try { await req('quota.setLang', { lang: lg }); } catch (e) { /* ignore */ }
          render();
        };
      });

      document.getElementById('pill').onclick = function (ev) {
        ev.stopPropagation();
        popOpen = !popOpen;
        document.getElementById('pop').classList.toggle('hidden', !popOpen);
      };
      document.querySelectorAll('.pop-item').forEach(function (el) {
        el.onclick = async function (ev) {
          ev.stopPropagation();
          popOpen = false;
          hideTip();
          await req('quota.setMode', { mode: el.dataset.mode });
          await refresh(false);
        };
      });
      document.addEventListener('click', function (ev) {
        if (popOpen && !ev.target.closest('.pill-wrap')) {
          popOpen = false;
          const p = document.getElementById('pop'); if (p) p.classList.add('hidden');
        }
        if (langOpen && !ev.target.closest('.lang-wrap')) {
          langOpen = false;
          const lp = document.getElementById('langPop'); if (lp) lp.classList.add('hidden');
        }
      });
      document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape' && popOpen) {
          popOpen = false; const p = document.getElementById('pop'); if (p) p.classList.add('hidden');
        }
        if (ev.key === 'Escape' && langOpen) {
          langOpen = false; const lp = document.getElementById('langPop'); if (lp) lp.classList.add('hidden');
        }
      });

      // two-way синхронизация порогов (inputs exist only while the modal is open)
      const inT = document.getElementById('inTurbo');
      const inE = document.getElementById('inEco');
      const bMin = document.getElementById('inBalMin');
      const bMax = document.getElementById('inBalMax');
      if (inT) inT.oninput = function () { state._draftTurbo = inT.value; syncThresholdInputs('turbo'); };
      if (bMax) bMax.oninput = function () { state._draftTurbo = bMax.value; if (inT) inT.value = bMax.value; updateSaveState(); };
      if (inE) inE.oninput = function () { state._draftEco = inE.value; syncThresholdInputs('eco'); };
      if (bMin) bMin.oninput = function () { state._draftEco = bMin.value; if (inE) inE.value = bMin.value; updateSaveState(); };

      var saveThrBtn = document.getElementById('saveThr');
      if (saveThrBtn) saveThrBtn.onclick = async function () {
        if (!thresholdsValid()) return;
        const t = parseInt(state._draftTurbo, 10), e = parseInt(state._draftEco, 10);
        await req('quota.setThresholds', { turboAbove: t, ecoBelow: e });
        await refresh(false);
        const b = document.getElementById('saveThr');
        if (b) {
          b.classList.add('saved'); b.textContent = L.saved;
          clearTimeout(savedTimer);
          savedTimer = setTimeout(function () { if (b) { b.classList.remove('saved'); b.textContent = L.saveThresholds; } }, 1600);
        }
      };

      // settings gear — open/close thresholds modal
      var gearBtn = document.getElementById('gearBtn');
      if (gearBtn) gearBtn.onclick = function () { settingsOpen = !settingsOpen; render(); };
      var modalClose = document.getElementById('modalClose');
      if (modalClose) modalClose.onclick = function () { settingsOpen = false; render(); };
      var modalBg = document.getElementById('modalBg');
      if (modalBg) modalBg.onclick = function (ev) { if (ev.target === modalBg) { settingsOpen = false; render(); } };

      // collapsible sections
      document.querySelectorAll('[data-sect-head]').forEach(function (h) {
        h.onclick = function (ev) {
          if (ev.target.closest('.log-tools')) return; // don't toggle when clicking Copy/Clear
          var s = h.getAttribute('data-sect-head');
          sectOpen[s] = !sectOpen[s];
          if (s === 'key' && !sectOpen.key && revealedKey) {
            revealedKey = ''; if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
          }
          if (s === 'key' && !sectOpen.key) { pinAsk = false; pinSetup = false; pinErr = ''; }
          render();
        };
      });

      // logs: copy + clear
      var cp = document.getElementById('copyLogs');
      if (cp) cp.onclick = function (ev) {
        ev.stopPropagation();
        var txt = ((state && state._logs) || []).map(function (l) {
          return new Date(l.ts).toLocaleTimeString() + ' ' + l.level + ' ' + l.line;
        }).join('\n');
        copyText(txt, function () { cp.textContent = '✓'; setTimeout(function () { cp.textContent = L.copyLogs; }, 1200); });
      };
      var cl = document.getElementById('clearLogs');
      if (cl) cl.onclick = async function (ev) {
        ev.stopPropagation();
        try { await req('quota.clearLogs'); if (state) state._logs = []; render(); } catch (e) { /* ignore */ }
      };

      var ki = document.getElementById('keyInput');
      if (ki) {
        ki.oninput = function () { keyDraft = ki.value; };
        document.getElementById('saveKey').onclick = async function () {
          await req('quota.setKey', { key: keyDraft });
          keyDraft = '';
          await refresh(false);
        };
      }
      var rk = document.getElementById('removeKey');
      if (rk) rk.onclick = async function () {
        var b = this; var old = b.textContent; b.disabled = true; b.textContent = '…';
        try {
          await req('quota.setKey', { key: '' });
          keyDraft = ''; revealedKey = ''; pinSetup = false; pinAsk = false; hasPin = false;
          if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
          await refresh(false);
        } catch (e) { b.textContent = old; b.disabled = false; }
      };

      var sk = document.getElementById('showKey');
      if (sk) sk.onclick = function () {
        pinErr = '';
        if (!hasPin) { pinSetup = true; pinAsk = false; render(); return; }
        pinAsk = true; pinSetup = false; render();
      };

      var sp = document.getElementById('savePin');
      if (sp) sp.onclick = async function () {
        var p1 = (document.getElementById('pin1') || {}).value || '';
        var p2 = (document.getElementById('pin2') || {}).value || '';
        if (!p1.trim()) { pinErr = L.pinRequired; render(); return; }
        if (p1 !== p2) { pinErr = L.pinWrong; render(); return; }
        try {
          await req('quota.setPin', { pin: p1.trim() });
          hasPin = true; pinSetup = false; pinAsk = false; pinErr = ''; render();
        } catch (e) { pinErr = String(e); render(); }
      };

      var subPin = document.getElementById('submitPin');
      if (subPin) subPin.onclick = async function () {
        var pin = (document.getElementById('pinAsk') || {}).value || '';
        try {
          var r = await req('quota.revealKey', { pin: pin });
          if (r && r.ok && r.key) {
            revealedKey = r.key; pinAsk = false; pinErr = ''; render();
            if (revealTimer) clearTimeout(revealTimer);
            revealTimer = setTimeout(function () { revealedKey = ''; revealTimer = null; render(); }, 30000);
          } else {
            pinErr = (r && r.error === 'bad-pin') ? L.pinWrong : L.pinRequired; render();
          }
        } catch (e) { pinErr = String(e); render(); }
      };

      var cancelPin = document.getElementById('cancelPin');
      if (cancelPin) cancelPin.onclick = function () { pinSetup = false; pinAsk = false; pinErr = ''; render(); };

      var cpk = document.getElementById('copyKey');
      if (cpk) cpk.onclick = function (ev) {
        ev.stopPropagation();
        copyText(revealedKey || '', function () { cpk.textContent = '✓'; setTimeout(function () { cpk.textContent = '📋'; }, 1200); });
      };

      var instBtn = document.getElementById('installSkillBtn');
      if (instBtn) instBtn.onclick = async function () {
        var b = this; var old = b.textContent; b.disabled = true; b.textContent = '…';
        var st = document.getElementById('installStatus');
        try {
          var r = await req('quota.installSkill');
          if (r && r.ok) {
            b.textContent = L.installOk; b.classList.add('saved');
            if (st) st.textContent = fmt(L.installPath, { path: r.path || '' });
            if (state) state._installedPath = r.path || true;
            setTimeout(function () { refresh(false); }, 1200);
            return;
          }
          b.textContent = L.installFail;
          if (st) st.textContent = (r && r.error) || '';
        } catch (e) { b.textContent = L.installFail; if (st) st.textContent = String(e); }
        setTimeout(function () { if (b) { b.textContent = old; b.disabled = false; } }, 2200);
      };

      var uBtn = document.getElementById('uninstallSkillBtn');
      if (uBtn) uBtn.onclick = async function () {
        var b = this; var old = b.textContent; b.disabled = true; b.textContent = '…';
        var st = document.getElementById('installStatus');
        try {
          var r = await req('quota.uninstallSkill');
          if (r && r.ok) { if (st) st.textContent = ''; await refresh(false); return; }
          b.textContent = old;
          if (st) st.textContent = (r && r.error) || '';
        } catch (e) { b.textContent = old; if (st) st.textContent = String(e); }
        setTimeout(function () { if (b) { b.textContent = old; b.disabled = false; } }, 2200);
      };

      // skill config — mark dirty on any field change
      ['cfgCron','cfgMaxW','cfgRpm','cfgCap','cfgEffort','cfgTz','cfgWin'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) { el.oninput = updateSkillCfgDirty; el.onchange = updateSkillCfgDirty; }
      });

      document.getElementById('saveSkillConfig').onclick = async function () {
        var b = this; var old = b.textContent; b.disabled = true;
        var cfg = readSkillCfgForm();
        try {
          var r = await req('quota.setSkillConfig', { config: JSON.stringify(cfg, null, 2) });
          b.textContent = (r && r.ok) ? (L.configSaved + (r.automationId ? ' · auto' : (r.automationError ? ' · ' + r.automationError : ''))) : L.configFail;
          if (state) state._skillCfg = cfg;
        } catch (e) { b.textContent = L.configFail; }
        setTimeout(function () { if (b) { b.textContent = old; b.disabled = false; updateSkillCfgDirty(); } }, 1600);
      };

      bindTooltips();
    }

    // Custom instant styled tooltips. Supports data-tip-mode (rich) and data-tip (plain text).
    var tipEl = document.getElementById('tipPop');
    var tipTimer = null;
    function hideTip() {
      if (tipTimer) { clearTimeout(tipTimer); tipTimer = null; }
      if (tipEl) { tipEl.classList.remove('show'); tipEl.style.display = 'none'; }
    }
    function esc(s) {
      return String(s).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; });
    }
    function showTip(target) {
      if (!tipEl) return;
      const m = target.getAttribute('data-tip-mode');
      const plain = target.getAttribute('data-tip');
      if (m && state) tipEl.innerHTML = tipHtml(m);
      else if (plain) tipEl.innerHTML = esc(plain);
      else return;
      tipEl.style.display = 'block';
      tipEl.classList.add('show');
      const r = target.getBoundingClientRect();
      const tr = tipEl.getBoundingClientRect();
      const gap = 8, margin = 8;
      let left = r.left + r.width / 2 - tr.width / 2;
      left = Math.max(margin, Math.min(left, window.innerWidth - tr.width - margin));
      let top = r.top - tr.height - gap;
      if (top < margin) top = r.bottom + gap;
      top = Math.max(margin, Math.min(top, window.innerHeight - tr.height - margin));
      tipEl.style.left = left + 'px';
      tipEl.style.top = top + 'px';
    }
    function bindTooltips() {
      document.querySelectorAll('[data-tip-mode], [data-tip]').forEach(function (el) {
        el.onmouseenter = function () { if (tipTimer) clearTimeout(tipTimer); showTip(el); };
        el.onmouseleave = hideTip;
      });
    }

    orca.on('theme', function () { /* CSS vars update in place; nothing needed */ });
    refresh(false);
    setInterval(function () { refresh(false); }, 60000);
    setInterval(function () { var el = document.getElementById('countdown'); if (el && state && state.resetAt) el.textContent = fmtCountdown(state.resetAt); }, 1000);
    }

    // Wait until the host injects window.orca, then boot.
    var tries = 0;
    (function waitForOrca() {
      if (window.orca && window.orca.plugin && typeof window.orca.plugin.request === 'function') {
        try { boot(window.orca); }
        catch (e) { showFatal((e && (e.stack || e.message)) || e); }
        return;
      }
      if (++tries > 200) { showFatal('orca bridge unavailable (window.orca did not appear)'); return; }
      setTimeout(waitForOrca, 25);
    })();
  })();
  </script>
